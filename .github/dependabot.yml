version: 2

updates:
  # ADR-0006: Auto-merge is OFF. Avalonia updates in particular can produce a UI
  # regression that tests won't catch — every PR is reviewed by hand.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Avalonia packages must be upgraded together; their versions are interdependent.
      avalonia:
        patterns:
          - "Avalonia*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Shouldly"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
