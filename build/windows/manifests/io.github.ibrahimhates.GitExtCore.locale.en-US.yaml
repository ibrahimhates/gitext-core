ShortDescription: Fast native Git GUI — browse history, stage changes and manage branches
Description: |-
  gitext-core is a fast, native Git GUI. It rebuilds the GitExtensions experience on modern
  .NET and Avalonia: a commit graph that makes tangled histories readable, a UI that maps onto
  how Git actually works, and speed that stays out of your way.

  It drives the real git command line rather than reimplementing it, so hooks, aliases,
  credential helpers and configuration behave exactly as they do in a terminal. Every operation
  shows the underlying command it ran.

  gitext-core collects no telemetry of any kind.

  Note: the installer is not code-signed, so Windows SmartScreen will warn on first run.
  See the project README for why, and for the SHA256 checksums to verify your download.
