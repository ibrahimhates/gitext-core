version: 2

updates:
  # ADR-0006: Otomatik merge KAPALI. Özellikle Avalonia güncellemeleri UI regresyonu
  # üretebilir ve bunu testler yakalamaz — her PR elle incelenir.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Avalonia paketleri birlikte yükseltilmeli; sürümleri birbirine bağlı.
      avalonia:
        patterns:
          - "Avalonia*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Shouldly"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
