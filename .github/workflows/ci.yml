name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # P10-T03 — Commit mesajı biçimi sürüm notlarının GİRDİSİ, üslup tercihi değil.
  # Sürüm notları commit'lerden üretiliyor (bu depoda PR akışı yok: 53 commit'in 50'si
  # doğrudan main'e atılmış), yani biçimi bozuk bir commit "Diğer" başlığına düşer.
  #
  # Yalnızca PR'larda: main'e atılmış commit'ler zaten geçmiş, geriye dönük kırmak
  # anlamsız. Kural bugünden itibaren geçerli.
  commits:
    name: Commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          # Aralık karşılaştırması için taban dal lazım; sığ klonda yok.
          fetch-depth: 0

      - name: Check Conventional Commits
        run: build/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  # P11-T10 — Gömülü İngilizce yedek, en.json'dan ÜRETİLİYOR. İkisi ayrışırsa hangi
  # metnin geçerli olduğu belirsizleşir: dosya bir şey, kod başka bir şey söyler.
  # Burada ayrışma derleme hatası hâline getiriliyor.
  localization:
    name: Localization fallback in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check generated fallback
        run: tools/i18n/generate-fallback.py --check

      # The codebase is one language. Without this check Turkish comments creep back in
      # one commit at a time and nobody notices until the mixture is large again.
      # String literals are exempt — test fixture data deliberately exercises UTF-8.
      - name: Check comment language
        run: build/check-comments.sh

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # --locked-mode: packages.lock.json güncel değilse build kırılır (ADR-0006).
      # Lock dosyası değiştiyse commit edilmelidir.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      # Katman ihlali (ADR-0003) build sırasında GITEXT001 hatası olarak yakalanır;
      # ayrıca LayeringTests çalışma zamanında ikinci kez doğrular.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # Render testi başarısız olursa görsel kanıt lazım (P01-T16).
      - name: Upload render artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-artifacts-${{ matrix.os }}
          path: '**/render-*.png'
          if-no-files-found: ignore

  # P02-T15 — Çekirdek katman, desteklenen EN ESKİ git sürümüne karşı da çalışmalı.
  # git'in çıktı formatları sürümler arası değişir ve ayrıştırıcılarımız bunlara dayanıyor;
  # yalnızca güncel git ile test etmek, eski dağıtımlardaki kullanıcıyı görmemek demek.
  #
  # 2.30.2 = ADR-0002'deki minimum (Debian bullseye'ın taşıdığı sürüm).
  # Runner'lar çok daha yeni git taşıdığı için kaynaktan derleniyor; sonuç önbelleklenir.
  min-git:
    name: Test with minimum git (2.30.2)
    runs-on: ubuntu-latest
    # git derlemesi önbelleklenir; ilk çalıştırma ~3 dk, sonrakiler ~1 dk.
    env:
      GIT_VERSION: 2.30.2

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache git build
        id: cache-git
        uses: actions/cache@v4
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}

      - name: Build git from source
        if: steps.cache-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libexpat1-dev gettext libz-dev libssl-dev
          curl -fsSL -o git.tar.gz \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.gz"
          tar -xf git.tar.gz
          cd "git-${GIT_VERSION}"
          make prefix="$HOME/git-${GIT_VERSION}" -j"$(nproc)" install

      - name: Verify git version
        run: |
          echo "$HOME/git-${GIT_VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/git-${GIT_VERSION}/bin/git" --version

      # Yalnızca çekirdek testleri: UI testleri git sürümünden etkilenmez.
      - name: Test GitExt.Core
        run: |
          git --version
          dotnet test tests/GitExt.Core.Tests -c Release

  publish:
    name: Publish smoke (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64, osx-x64]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Yayınlanan yapılandırmanın derlendiğini her PR'da doğrula — sürüm gününde
      # sürprizle karşılaşmamak için (Faz 10).
      - name: Publish self-contained
        run: |
          dotnet publish src/GitExt.Desktop \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:PublishReadyToRun=true \
            -o ./dist/${{ matrix.rid }}

      - name: Report size
        run: du -sh ./dist/${{ matrix.rid }}

  # P09-T16 — performans regresyon koruması.
  #
  # UYARIR, KIRMAZ. Planın maddesi: "Kırmızı yapmak değil, uyarmak — CI makinelerinin
  # gürültüsü yanlış alarm üretir." Paylaşımlı runner'lar CPU'yu komşu işlerle
  # paylaşıyor; P09-T02'de aynı benchmark'ın iki koşusu arasında %10'a varan fark
  # ölçüldü. Bir eşiği kırmızı yapmak, gerçek regresyonları da görmezden gelinen bir
  # gürültü akışına gömerdi.
  #
  # Yalnızca Linux'ta: üç işletim sisteminde ölçmek gürültüyü üçe katlar, karşılaştırma
  # değeri artmaz. Temel çizgi zaten tek bir makinede alındı.
  benchmarks:
    name: Performance regression check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build benchmarks
        run: dotnet build benchmarks/GitExt.Benchmarks -c Release --no-restore

      # --fast: 1 warmup, 3 iterasyon. Tam koşu CI'da ~15 dakika sürüyor ve elde edilen
      # dar güven aralığı, makinenin gürültüsü yanında zaten anlamını yitiriyor.
      - name: Run benchmarks
        run: dotnet run --project benchmarks/GitExt.Benchmarks -c Release --no-build -- --fast

      - name: Compare against baseline
        run: |
          shopt -s nullglob
          for current in benchmarks/GitExt.Benchmarks/BenchmarkDotNet.Artifacts/results/*-brief.json; do
            baseline="benchmarks/baseline/results/$(basename "$current")"
            if [ -f "$baseline" ]; then
              echo "--- $(basename "$current") ---"
              python3 tools/compare-benchmarks.py "$baseline" "$current"
            else
              echo "::warning::Temel çizgi yok: $(basename "$current")"
            fi
          done

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/GitExt.Benchmarks/BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: ignore
