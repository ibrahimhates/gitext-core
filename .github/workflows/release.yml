name: Release

# Sürüm etiketi itildiğinde çalışır: v0.2.0, v1.0.0-rc1 …
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (etiketsiz deneme için)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux paketleri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü belirle
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      # Yayın öncesi testler ŞART: yayınlanmış bir paketi geri çekmek, çıkmasını
      # engellemekten çok daha pahalı.
      - name: Test
        run: dotnet test -c Release
        env:
          AVALONIA_HEADLESS: '1'

      # AppImage'ın kendi çalıştırılması FUSE istiyor; runner'da yok, bu yüzden
      # appimagetool `--appimage-extract-and-run` ile çalışıyor (betik kendisi seçiyor).
      - name: Paketle
        run: build/linux/package.sh "${{ steps.version.outputs.value }}"

      # Üretilen ikili GERÇEKTEN çalışmalı: paketleme başarılı olup çalıştırılabilir
      # bozuk çıkabilir (trimming eksik bir bağımlılığı atabiliyor).
      - name: Duman testi
        run: |
          ./dist/gitext-core-${{ steps.version.outputs.value }}-x86_64.AppImage --headless
          tar -xzf dist/gitext-core-${{ steps.version.outputs.value }}-linux-x64.tar.gz -C /tmp
          /tmp/gitext-core/gitext-core --headless

      - name: Yayına ekle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/gitext-core-*.AppImage
            dist/gitext-core-*.tar.gz

      - name: Artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/gitext-core-*.AppImage
            dist/gitext-core-*.tar.gz
