# winget manifesti — kurulum paketi (P10-T18).
#
# ÜRETİLMİŞ ŞABLON: sürüm, URL ve SHA256 yayın sırasında doldurulur.
# winget-pkgs deposuna gönderim: https://github.com/microsoft/winget-pkgs
#
# ⚠️ İmzasız paket (P10-T17): winget kurulumu SmartScreen uyarısını ATLAMIYOR ama
# kullanıcı komut satırında olduğu için deneyim daha az kırılgan. Bu, imzasız
