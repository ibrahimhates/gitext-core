name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # P10-T03 — Commit message format is the INPUT to the release notes, not a style
  # preference. Release notes are generated from commits (this repo has no PR flow:
  # 50 of 53 commits were pushed straight to main), so a badly formatted commit
  # falls into the "Other" heading.
  #
  # Only on PRs: commits already pushed to main are history, breaking them
  # retroactively is pointless. The rule applies from today onward.
  commits:
    name: Commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          # A base branch is needed for range comparison; not present in a shallow clone.
          fetch-depth: 0

      - name: Check Conventional Commits
        run: build/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  # P11-T10 — The embedded English fallback is GENERATED from en.json. If the two
  # drift apart, which text is authoritative becomes ambiguous: the file says one
  # thing, the code says another. Here, drift is turned into a build failure.
  localization:
    name: Localization fallback in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check generated fallback
        run: tools/i18n/generate-fallback.py --check

      # The codebase is one language. Without this check Turkish comments creep back in
      # one commit at a time and nobody notices until the mixture is large again.
      # String literals are exempt — test fixture data deliberately exercises UTF-8.
      - name: Check comment language
        run: build/check-comments.sh

      # A dropped </para> fails the build with CS1570, but the message names the end of the
      # block rather than the missing tag. This points straight at the line.
      - name: Check XML doc tags
        run: build/check-xmldoc.py

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # --locked-mode: the build fails if packages.lock.json is not up to date (ADR-0006).
      # If the lock file changed, it must be committed.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      # A layering violation (ADR-0003) is caught as a GITEXT001 error during the build;
      # LayeringTests also verifies it a second time at runtime.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # If the render test fails, visual evidence is needed (P01-T16).
      - name: Upload render artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-artifacts-${{ matrix.os }}
          path: '**/render-*.png'
          if-no-files-found: ignore

  # P02-T15 — The core layer must also work against the OLDEST supported git version.
  # git's output formats change across versions and our parsers depend on them; testing
  # only against current git means not seeing the user on an older distro.
  #
  # 2.30.2 = the minimum from ADR-0002 (the version Debian bullseye ships).
  # Runners carry a much newer git, so it's built from source; the result is cached.
  min-git:
    name: Test with minimum git (2.30.2)
    runs-on: ubuntu-latest
    # The git build is cached; the first run takes ~3 min, subsequent runs ~1 min.
    env:
      GIT_VERSION: 2.30.2

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache git build
        id: cache-git
        uses: actions/cache@v6
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}

      - name: Build git from source
        if: steps.cache-git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libexpat1-dev gettext libz-dev libssl-dev
          curl -fsSL -o git.tar.gz \
            "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.gz"
          tar -xf git.tar.gz
          cd "git-${GIT_VERSION}"
          make prefix="$HOME/git-${GIT_VERSION}" -j"$(nproc)" install

      - name: Verify git version
        run: |
          echo "$HOME/git-${GIT_VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/git-${GIT_VERSION}/bin/git" --version

      # Only the core tests: UI tests are not affected by the git version.
      - name: Test GitExt.Core
        run: |
          git --version
          dotnet test tests/GitExt.Core.Tests -c Release

  publish:
    name: Publish smoke (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64, osx-x64]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Verify on every PR that the published configuration builds — so there are
      # no surprises on release day (Phase 10).
      - name: Publish self-contained
        run: |
          dotnet publish src/GitExt.Desktop \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:PublishReadyToRun=true \
            -o ./dist/${{ matrix.rid }}

      - name: Report size
        run: du -sh ./dist/${{ matrix.rid }}

  # P09-T16 — performance regression guard.
  #
  # WARNS, DOES NOT FAIL. From the plan: "Not to turn it red, but to warn — CI
  # machine noise produces false alarms." Shared runners share CPU with neighboring
  # jobs; in P09-T02 a difference of up to 10% was measured between two runs of the
  # same benchmark. Turning a threshold red would bury real regressions in a noise
  # stream that gets ignored.
  #
  # Linux only: measuring on three operating systems triples the noise without
  # adding comparison value. The baseline was already taken on a single machine.
  benchmarks:
    name: Performance regression check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build benchmarks
        run: dotnet build benchmarks/GitExt.Benchmarks -c Release --no-restore

      # --fast: 1 warmup, 3 iterations. A full run takes ~15 minutes in CI, and the
      # narrow confidence interval it buys already loses its meaning next to the
      # machine's noise.
      - name: Run benchmarks
        run: dotnet run --project benchmarks/GitExt.Benchmarks -c Release --no-build -- --fast

      - name: Compare against baseline
        run: |
          shopt -s nullglob
          for current in benchmarks/GitExt.Benchmarks/BenchmarkDotNet.Artifacts/results/*-brief.json; do
            baseline="benchmarks/baseline/results/$(basename "$current")"
            if [ -f "$baseline" ]; then
              echo "--- $(basename "$current") ---"
              python3 tools/compare-benchmarks.py "$baseline" "$current"
            else
              echo "::warning::No baseline: $(basename "$current")"
            fi
          done

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/GitExt.Benchmarks/BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: ignore
