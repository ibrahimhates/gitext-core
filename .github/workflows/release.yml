name: Release

# Runs when a version tag is pushed: v1.0.0, v1.0.0-rc.1 …
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for tagless trial run)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Only what is on main is released.
  #
  # ⚠️ A tag push carries NO branch. The event's ref is `refs/tags/v1.0.0` and GitHub
  # offers no "which branch is this tag on" — a `branches:` filter next to `tags:` is
  # silently ignored for tag pushes. So the question is put to git itself: is the tagged
  # commit reachable from origin/main? Without it, a tag pushed from a feature branch
  # publishes that tree under a release version and no step turns red.
  #
  # The same rule covers workflow_dispatch: there GITHUB_SHA is the head of the branch
  # the run was started from, so a trial run from a side branch is refused too.
  #
  # Every other job hangs off this one, so nothing — not even the tests — starts before
  # the question is answered.
  guard:
    name: Only from main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # REQUIRED: ancestry cannot be answered in a shallow clone

      - name: The commit must be on main
        run: |
          set -euo pipefail

          # main is fetched EXPLICITLY rather than relying on what checkout happens to
          # bring along: on a tag push the branch refs are not the point of the checkout,
          # and a missing origin/main would turn this guard into a green no-op.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main — the release is stopped." >&2
            echo "A tag can be pushed from any branch; only what is on main is released." >&2
            echo "Merge the commit into main first, then tag it there." >&2
            exit 1
          fi

          echo "OK: $GITHUB_SHA is on main."

      # ⚠️ Being ON main is not the same as being CURRENT with main. A tag left behind by later
      # work still passes the check above, and the release then builds and TESTS a stale tree —
      # so fixes that are already on main appear to "not work", because this run never had them.
      #
      # MEASURED: v0.1.1 sat 26 commits behind main. Its tree still had the un-fixed versions of
      # tests that had since been repaired (Buyuk_cikti at 500 commits, the cancellation test
      # still cancelling from a progress callback, no UI parallelism attribute, no MSYS2 step),
      # so the release kept failing on faults that no longer existed on main.
      #
      # This does not block the release — an intentional re-release of an older tag is legitimate.
      # It makes the situation VISIBLE, so a stale tree is never mistaken for a broken fix.
      - name: How far behind main is this tag?
        run: |
          set -euo pipefail

          behind="$(git rev-list --count "$GITHUB_SHA"..origin/main)"

          if [ "$behind" -eq 0 ]; then
            echo "OK: the tag is the tip of main."
            exit 0
          fi

          echo "::warning::This tag is $behind commit(s) behind main — an OLDER tree is being released."
          echo "Commits on main that this release does NOT contain:"
          git log --oneline --no-decorate "$GITHUB_SHA"..origin/main | head -30
          echo
          echo "If a fix you expect is in that list, it is not in this release: tag the current main."

  # ───────────────────────────────────────────────────────────────────────────
  # The version is determined once and distributed to all jobs from here.
  #
  # ⚠️ MEASURED (P10-T00) — in a shallow clone MinVer silently produces 0.0.0-alpha.0,
  # and pushing the `v1.0.0` tag would publish a version named "0.0.0-alpha.0"; no step
  # would turn red. fetch-depth: 0 + version.sh --check closes this off.
  version:
    name: Determine version
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      value: ${{ steps.derive.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # REQUIRED: MinVer can't derive a version without tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ⚠️ REQUIRED. The version is read from MSBuild through the MinVer TARGET, and that
      # target ships in the NuGet package — without a restore it does not exist and MSBuild
      # answers "MSB4057: The target 'MinVer' does not exist in the project". This is what
      # broke the v0.1.0 release: the job read an empty version and stopped.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Derive and verify version
        id: derive
        env:
          MINVER_VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          # ⚠️ `set -o pipefail` is REQUIRED. Measured: written as `version.sh --check |
          # sed`, the script's exit code gets replaced by SED's, and the step stays
          # GREEN even when validation fails — carrying on with an empty version.
          # This is exactly the silent failure this step exists to prevent.
          set -euo pipefail

          version="$(build/version.sh --check)"
          version="${version#OK: }"

          if [ -z "$version" ]; then
            echo "::error::Version is empty — halting release." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  # Pre-release tests are REQUIRED: pulling back a published package is far more
  # expensive than stopping it from going out.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test -c Release
        env:
          AVALONIA_HEADLESS: '1'

  # ───────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    needs: [version, test]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # For icon generation and metadata validation.
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick desktop-file-utils appstream

      # 🔴 `--no-net`. MEASURED: without it, `appstreamcli validate` FETCHES every <url>
      # in the file and an unreachable one is a warning — and the tool exits 3 on warnings,
      # so the release stops. The link it could not reach was our own bug tracker, and the
      # URL is correct: at the same moment `github.com/git/git/issues` answered 404 too, and
      # the repository's API reports the issue tracker as open. GitHub throttles anonymous
      # page requests and a runner asks from a shared address, so the answer is a coin flip.
      # Every offline rule (schema, required fields, licence identifiers) still applies.
      - name: Validate metadata
        run: |
          desktop-file-validate build/linux/io.github.ibrahimhates.GitExtCore.desktop
          appstreamcli validate --no-net build/linux/io.github.ibrahimhates.GitExtCore.metainfo.xml

      # Running the AppImage itself needs FUSE; the runner doesn't have it, so
      # appimagetool runs with `--appimage-extract-and-run` (the script picks this itself).
      - name: Tarball + AppImage
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/linux/package.sh

      - name: .deb + .rpm
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/linux/package-deb-rpm.sh

      # The produced binary must ACTUALLY run: packaging can succeed while the
      # executable comes out broken (trimming can drop a needed dependency).
      - name: Smoke test
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          ./dist/gitext-core-"$V"-x86_64.AppImage --appimage-extract-and-run --version
          tar -xzf dist/gitext-core-"$V"-linux-x64.tar.gz -C /tmp
          /tmp/gitext-core/gitext-core --version

      # That the packages ACTUALLY install is verified in a clean container of that
      # distro (P10-T24). Working on the dev machine proves nothing.
      - name: Clean-system verification
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          deb_version="${V/-/~}"

          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -c "
            apt-get update -qq >/dev/null &&
            apt-get install -y -qq /dist/gitext-core_${deb_version}_amd64.deb >/dev/null &&
            gitext-core --version"

          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 sh -c "
            dnf install -y -q /dist/gitext-core-${V}-1.fc41.x86_64.rpm >/dev/null &&
            gitext-core --version"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/gitext-core[-_]*.AppImage
            dist/gitext-core[-_]*.tar.gz
            dist/gitext-core[-_]*.deb
            dist/gitext-core[-_]*.rpm

  # ───────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows packages
    runs-on: windows-latest
    needs: [version, test]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # package.sh is a bash script; Git Bash is available on the Windows runner.
      # Icon generation needs rsvg-convert and magick — installed via MSYS2 below,
      # matching the apt (Linux) and brew (macOS) tool steps.
      #
      # ⚠️ The ref is `v2` — the floating major tag. Neither `v3` nor `master` exists in
      # that repository (both were tried and the job died in "Set up job" with
      # "unable to resolve action"); the default branch is `main` and the newest release
      # is v2.32.0. Checked with `git ls-remote`, not guessed.
      - name: Tools (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-imagemagick

      # ⚠️ Installing the packages is NOT enough on its own — that was the first attempt and the
      # job still died with "rsvg-convert not found". setup-msys2 puts the tools inside the MSYS2
      # installation and exposes them through its OWN shell (`shell: msys2 {0}`), while the
      # packaging step below runs under `shell: bash`, which on a Windows runner is GIT BASH — a
      # separate environment whose PATH does not contain /mingw64/bin.
      #
      # The step is deliberately NOT switched to `shell: msys2 {0}`: package.sh also needs
      # `dotnet` (installed on the Windows side by setup-dotnet) and `python3`, and those would
      # be the ones missing instead. Adding the MinGW64 bin directory to PATH gives Git Bash the
      # icon tools while leaving everything else it already has intact.
      - name: MinGW64 bin -> PATH
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          # The location comes back as a Windows path; Git Bash wants forward slashes.
          # ⚠️ NOT `echo`: the runner's workspace is D:\a\..., and echo eats the \a as an escape,
          # silently producing D:/_temp/... with the "a" missing. Verified both forms locally.
          mingw_bin="${MSYS2_LOCATION//\\//}/mingw64/bin"
          echo "$mingw_bin" >> "$GITHUB_PATH"

          # Fail HERE, with a clear message, rather than inside package.sh: a missing tool at
          # this point means the assumption about where setup-msys2 puts things is wrong again.
          for tool in rsvg-convert magick; do
            test -e "$mingw_bin/$tool.exe" \
              || { echo "::error::$tool not found in $mingw_bin" >&2; ls "$mingw_bin" | head -50; exit 1; }
          done
          echo "OK: rsvg-convert and magick found in $mingw_bin"

      - name: ZIP + Inno Setup script
        shell: bash
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/windows/package.sh

      # The Windows output is ACTUALLY run — the only place in the project where
      # that's possible.
      - name: Smoke test
        shell: pwsh
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          $output = & "./dist/win-x64/gitext-core/gitext-core.exe" --version
          Write-Host $output
          if ($output -notmatch [regex]::Escape($env:V)) {
            throw "Version mismatch: '$output' does not contain '$($env:V)'"
          }

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup is not installed on the runner image; it comes via chocolatey.
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dist/gitext-core.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist/gitext-core-*.zip
            dist/gitext-core-*-setup.exe

  # ───────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS packages (${{ matrix.rid }})
    runs-on: macos-latest
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Tools
        run: brew install librsvg imagemagick

      - name: .app bundle
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: build/macos/package.sh

      # The macOS output is ACTUALLY run — only possible here.
      # The x64 binary may not run without Rosetta on the arm64 runner, so it's
      # only exercised on its own architecture.
      - name: Smoke test
        if: matrix.rid == 'osx-arm64'
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          output="$(./dist/${{ matrix.rid }}/gitext-core.app/Contents/MacOS/gitext-core --version)"
          echo "$output"
          echo "$output" | grep -qF "$V"

      # hdiutil is ONLY available on macOS (P10-T21); the .dmg is built here.
      - name: .dmg
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          hdiutil create -volname gitext-core \
            -srcfolder "dist/${{ matrix.rid }}/gitext-core.app" \
            -ov -format UDZO \
            "dist/gitext-core-$V-${{ matrix.rid }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-packages-${{ matrix.rid }}
          path: |
            dist/gitext-core-*.dmg
            dist/gitext-core-*-osx-*.tar.gz

  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, linux, windows, macos]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect outputs
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist/

      # Integrity file: SHA256 for every output (P10-T04).
      # GPG signing only if a key is defined; otherwise the SKIP is announced.
      - name: SHA256SUMS
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi
          build/checksums.sh

      # ⚠️ The tag name cannot be taken from `github.ref_name`: on a workflow_dispatch run that
      # is the BRANCH (refs/heads/...), not a tag. The job used to carry
      # `if: startsWith(github.ref, 'refs/tags/')`, so a manual run SKIPPED this job entirely —
      # the pipeline went all green and no release appeared. Now the job always runs and the tag
      # is derived: the ref on a tag push, otherwise the version this run was told to build.
      - name: Determine tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            # A manual run: v-prefix the version, matching how the tags are named.
            case "$VERSION" in v*) tag="$VERSION" ;; *) tag="v$VERSION" ;; esac
          fi

          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (ref_type=$REF_TYPE)"

      # Release notes are generated from COMMITS (P10-T03): this repo has no PR
      # flow, so GitHub's own generator would give an almost-empty note.
      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: build/release-notes.sh "$TAG" > release-notes.md

      # `draft: false` — the release is published as soon as it is created.
      #
      # Everything that could go wrong has ALREADY been checked by this point: the guard
      # confirms the tag is on main, every platform's tests are green, each binary was smoke
      # tested by running `--version`, and SHA256SUMS was produced. Leaving the result as a
      # draft only added a manual step that had to be remembered after a long pipeline.
      #
      # `prerelease` follows the tag: a version carrying a pre-release suffix (v1.0.0-rc.1,
      # -alpha, -beta) is marked as a pre-release on GitHub, a plain v1.0.0 is a full release.
      # Without this an -rc tag would be published as if it were stable.
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          # Explicit: on a manual run there is no tag ref for the action to infer from.
          tag_name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          body_path: release-notes.md
          files: |
            dist/gitext-core[-_]*
            dist/SHA256SUMS*
