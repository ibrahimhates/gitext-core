name: Release

# Sürüm etiketi itildiğinde çalışır: v1.0.0, v1.0.0-rc.1 …
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (etiketsiz deneme için)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Sürüm bir kez belirlenir ve tüm işlere buradan dağıtılır.
  #
  # ⚠️ ÖLÇÜLDÜ (P10-T00) — sığ klonda MinVer sessizce 0.0.0-alpha.0 üretiyor ve
  # `v1.0.0` tag'ine basmak "0.0.0-alpha.0" adlı bir sürüm yayınlardı; hiçbir adım
  # kırmızıya dönmezdi. fetch-depth: 0 + version.sh --check bunu kapatıyor.
  version:
    name: Sürümü belirle
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.derive.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ŞART: tag'ler olmadan MinVer sürümü türetemiyor

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü türet ve doğrula
        id: derive
        env:
          MINVER_VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          # ⚠️ `set -o pipefail` ŞART. Ölçüldü: `version.sh --check | sed` biçiminde
          # yazıldığında betiğin çıkış kodu SED'inkiyle değişiyor ve doğrulama
          # başarısız olsa bile adım YEŞİL kalıyordu — boş bir sürümle devam ederek.
          # Tam da bu adımın engellemek için var olduğu sessiz hata.
          set -euo pipefail

          version="$(build/version.sh --check)"
          version="${version#OK: }"

          if [ -z "$version" ]; then
            echo "::error::Sürüm boş — yayın durduruluyor." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $version"

  # Yayın öncesi testler ŞART: yayınlanmış bir paketi geri çekmek, çıkmasını
  # engellemekten çok daha pahalı.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test -c Release
        env:
          AVALONIA_HEADLESS: '1'

  # ───────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux paketleri
    runs-on: ubuntu-latest
    needs: [version, test]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # İkon üretimi ve metadata doğrulaması için.
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick desktop-file-utils appstream

      - name: Metadata doğrula
        run: |
          desktop-file-validate build/linux/io.github.ibrahimhates.GitExtCore.desktop
          appstreamcli validate build/linux/io.github.ibrahimhates.GitExtCore.metainfo.xml

      # AppImage'ın kendi çalıştırılması FUSE istiyor; runner'da yok, bu yüzden
      # appimagetool `--appimage-extract-and-run` ile çalışıyor (betik kendisi seçiyor).
      - name: Tarball + AppImage
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/linux/package.sh

      - name: .deb + .rpm
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/linux/package-deb-rpm.sh

      # Üretilen ikili GERÇEKTEN çalışmalı: paketleme başarılı olup çalıştırılabilir
      # bozuk çıkabilir (trimming eksik bir bağımlılığı atabiliyor).
      - name: Duman testi
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          ./dist/gitext-core-"$V"-x86_64.AppImage --appimage-extract-and-run --version
          tar -xzf dist/gitext-core-"$V"-linux-x64.tar.gz -C /tmp
          /tmp/gitext-core/gitext-core --version

      # Paketlerin GERÇEKTEN kurulabildiği, o dağıtımın temiz konteynerinde
      # doğrulanıyor (P10-T24). Geliştirme makinesinde çalışması hiçbir şey kanıtlamaz.
      - name: Temiz sistem doğrulaması
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          deb_version="${V/-/\~}"

          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -c "
            apt-get update -qq >/dev/null &&
            apt-get install -y -qq /dist/gitext-core_${deb_version}_amd64.deb >/dev/null &&
            gitext-core --version"

          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 sh -c "
            dnf install -y -q /dist/gitext-core-${deb_version}-1.fc41.x86_64.rpm >/dev/null &&
            gitext-core --version"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/gitext-core[-_]*.AppImage
            dist/gitext-core[-_]*.tar.gz
            dist/gitext-core[-_]*.deb
            dist/gitext-core[-_]*.rpm

  # ───────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows paketleri
    runs-on: windows-latest
    needs: [version, test]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # package.sh bash betiği; Windows runner'ında Git Bash mevcut.
      # rsvg-convert yok, bu yüzden ikonlar önceden üretilmiş .ico'dan geliyor —
      # betik ikon üretimini atlıyorsa build kırılmıyor (koşullu ApplicationIcon).
      - name: ZIP + Inno Setup betiği
        shell: bash
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
        run: build/windows/package.sh

      # Windows çıktısı GERÇEKTEN çalıştırılıyor — bu, projede yalnızca burada mümkün.
      - name: Duman testi
        shell: pwsh
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          $output = & "./dist/win-x64/gitext-core/gitext-core.exe" --version
          Write-Host $output
          if ($output -notmatch [regex]::Escape($env:V)) {
            throw "Sürüm uyuşmuyor: '$output' içinde '$($env:V)' yok"
          }

      - name: Kurulum paketini derle
        shell: pwsh
        run: |
          # Inno Setup runner imajında kurulu değil; chocolatey ile geliyor.
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dist/gitext-core.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist/gitext-core-*.zip
            dist/gitext-core-*-setup.exe

  # ───────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS paketleri (${{ matrix.rid }})
    runs-on: macos-latest
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Araçlar
        run: brew install librsvg imagemagick

      - name: .app bundle
        env:
          MINVER_VERSION_OVERRIDE: ${{ needs.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: build/macos/package.sh

      # macOS çıktısı GERÇEKTEN çalıştırılıyor — yalnızca burada mümkün.
      # arm64 runner'da x64 ikili Rosetta olmadan çalışmayabilir; bu yüzden
      # yalnızca kendi mimarisinde deneniyor.
      - name: Duman testi
        if: matrix.rid == 'osx-arm64'
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          output="$(./dist/${{ matrix.rid }}/gitext-core.app/Contents/MacOS/gitext-core --version)"
          echo "$output"
          echo "$output" | grep -qF "$V"

      # hdiutil YALNIZCA macOS'ta var (P10-T21); .dmg burada üretiliyor.
      - name: .dmg
        env:
          V: ${{ needs.version.outputs.value }}
        run: |
          hdiutil create -volname gitext-core \
            -srcfolder "dist/${{ matrix.rid }}/gitext-core.app" \
            -ov -format UDZO \
            "dist/gitext-core-$V-${{ matrix.rid }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-packages-${{ matrix.rid }}
          path: |
            dist/gitext-core-*.dmg
            dist/gitext-core-*-osx-*.tar.gz

  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release taslağı
    runs-on: ubuntu-latest
    needs: [version, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Çıktıları topla
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist/

      # Bütünlük dosyası: her çıktı için SHA256 (P10-T04).
      # GPG imzası yalnızca anahtar tanımlıysa; yoksa ATLANDIĞI SÖYLENİYOR.
      - name: SHA256SUMS
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi
          build/checksums.sh

      # Sürüm notları COMMIT'lerden üretiliyor (P10-T03): bu depoda PR akışı yok,
      # GitHub'ın kendi üreteci neredeyse boş bir not verirdi.
      - name: Sürüm notları
        run: build/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: |
            dist/gitext-core[-_]*
            dist/SHA256SUMS*
